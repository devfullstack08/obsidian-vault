<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
  <rect width="1600" height="1180" fill="#faf7ef"/>
  <style>
    text { font-family: Arial, sans-serif; fill: #243036; }
    .title { font-size: 28px; font-weight: bold; }
    .note { font-size: 15px; fill: #5c564c; }
    .name { font-size: 16px; font-weight: bold; }
    .role { font-size: 13px; fill: #3d474b; }
    .on-dark { fill: #ffffff; }
    .on-dark-dim { fill: #f3efe6; }
    line, path { stroke: #8a8172; stroke-width: 2; fill: none; }
  </style>

  <text x="40" y="42" class="title">One family, two lines: why Ali is both cousin and son-in-law</text>
  <text x="40" y="70" class="note">No photograph exists. These people lived in the 7th century, before cameras. A picture on the internet is a later imagination, not a portrait from life.</text>

  <rect x="650" y="96" width="300" height="58" rx="8" fill="#1e3a4c"/>
  <text x="800" y="120" text-anchor="middle" class="on-dark name">Hashim</text>
  <text x="800" y="140" text-anchor="middle" class="on-dark-dim role">great-grandfather of Muhammad</text>
  <path d="M800,154 V176"/>

  <rect x="620" y="176" width="360" height="58" rx="8" fill="#1e3a4c"/>
  <text x="800" y="200" text-anchor="middle" class="on-dark name">Abd al-Muttalib</text>
  <text x="800" y="220" text-anchor="middle" class="on-dark-dim role">grandfather; father of Abdullah and Abu Talib</text>
  <path d="M800,234 V258"/>
  <path d="M280,258 H1320"/>
  <path d="M280,258 V280"/>
  <path d="M1320,258 V280"/>

  <rect x="120" y="280" width="320" height="64" rx="8" fill="#e7eef2" stroke="#1e3a4c" stroke-width="2"/>
  <text x="280" y="306" text-anchor="middle" class="name">Abdullah</text>
  <text x="280" y="326" text-anchor="middle" class="role">Muhammad's father. Died before the birth.</text>
  <path d="M280,344 V368"/>

  <rect x="1160" y="280" width="320" height="64" rx="8" fill="#f8efe6" stroke="#a85b1a" stroke-width="2"/>
  <text x="1320" y="306" text-anchor="middle" class="name">Abu Talib</text>
  <text x="1320" y="326" text-anchor="middle" class="role">Muhammad's uncle; Ali's father</text>
  <path d="M1320,344 V368"/>

  <rect x="90" y="368" width="380" height="78" rx="8" fill="#1e3a4c"/>
  <text x="280" y="398" text-anchor="middle" class="on-dark name">Prophet Muhammad</text>
  <text x="280" y="420" text-anchor="middle" class="on-dark-dim role">son of Abdullah. Died 632 in Medina.</text>
  <path d="M280,446 V478"/>

  <rect x="1140" y="368" width="360" height="78" rx="8" fill="#a85b1a"/>
  <text x="1320" y="398" text-anchor="middle" class="on-dark name">Ali ibn Abi Talib</text>
  <text x="1320" y="420" text-anchor="middle" class="on-dark-dim role">son of Abu Talib. Same man as the husband below.</text>

  <text x="40" y="460" class="name">Children of Muhammad</text>

  <path d="M80,478 H1040"/>
  <path d="M80,478 V500"/>
  <path d="M230,478 V500"/>
  <path d="M390,478 V500"/>
  <path d="M560,478 V500"/>
  <path d="M760,478 V500"/>
  <path d="M920,478 V500"/>
  <path d="M1040,478 V500"/>

  <rect x="20" y="508" width="120" height="72" rx="6" fill="#fff" stroke="#c4bba8" stroke-width="1.5"/>
  <text x="80" y="538" text-anchor="middle" class="name">Qasim</text>
  <text x="80" y="558" text-anchor="middle" class="role">son, died young</text>

  <rect x="160" y="508" width="140" height="72" rx="6" fill="#fff" stroke="#c4bba8" stroke-width="1.5"/>
  <text x="230" y="538" text-anchor="middle" class="name">Zaynab</text>
  <text x="230" y="558" text-anchor="middle" class="role">daughter</text>

  <rect x="320" y="508" width="150" height="72" rx="6" fill="#fff" stroke="#c4bba8" stroke-width="1.5"/>
  <text x="395" y="538" text-anchor="middle" class="name">Ruqayyah</text>
  <text x="395" y="558" text-anchor="middle" class="role">daughter</text>

  <rect x="490" y="508" width="160" height="72" rx="6" fill="#fff" stroke="#c4bba8" stroke-width="1.5"/>
  <text x="570" y="534" text-anchor="middle" class="name">Umm Kulthum</text>
  <text x="570" y="554" text-anchor="middle" class="role">daughter of Muhammad</text>

  <rect x="670" y="500" width="190" height="86" rx="6" fill="#f3e4d4" stroke="#8a3d12" stroke-width="2"/>
  <text x="765" y="532" text-anchor="middle" class="name">Fatimah al-Zahra</text>
  <text x="765" y="554" text-anchor="middle" class="role">daughter. Married Ali.</text>
  <text x="765" y="572" text-anchor="middle" class="role">This is the bloodline Shias follow.</text>

  <rect x="880" y="508" width="140" height="72" rx="6" fill="#fff" stroke="#c4bba8" stroke-width="1.5"/>
  <text x="950" y="534" text-anchor="middle" class="name">Abdullah</text>
  <text x="950" y="554" text-anchor="middle" class="role">son, died young</text>

  <rect x="1040" y="508" width="150" height="72" rx="6" fill="#fff" stroke="#c4bba8" stroke-width="1.5"/>
  <text x="1115" y="534" text-anchor="middle" class="name">Ibrahim</text>
  <text x="1115" y="554" text-anchor="middle" class="role">son of Mariya; died young</text>

  <path d="M765,586 V630"/>
  <path d="M1320,446 V630"/>
  <path d="M765,630 H1320"/>

  <rect x="520" y="640" width="560" height="70" rx="8" fill="#a85b1a"/>
  <text x="800" y="668" text-anchor="middle" class="on-dark name">Fatimah married Ali ibn Abi Talib</text>
  <text x="800" y="690" text-anchor="middle" class="on-dark-dim role">One Ali: cousin through Abu Talib, and son-in-law through Fatimah.</text>
  <path d="M800,710 V748"/>
  <path d="M250,748 H1350"/>
  <path d="M250,748 V770"/>
  <path d="M620,748 V770"/>
  <path d="M980,748 V770"/>
  <path d="M1350,748 V770"/>

  <text x="40" y="735" class="name">Children of Fatimah and Ali</text>

  <rect x="130" y="820" width="240" height="78" rx="8" fill="#f8efe6" stroke="#a85b1a" stroke-width="2"/>
  <text x="250" y="850" text-anchor="middle" class="name">Hasan</text>
  <text x="250" y="872" text-anchor="middle" class="role">elder son. 2nd Imam for Shias.</text>

  <rect x="500" y="820" width="240" height="78" rx="8" fill="#f3e4d4" stroke="#8a3d12" stroke-width="2"/>
  <text x="620" y="850" text-anchor="middle" class="name">Husayn</text>
  <text x="620" y="872" text-anchor="middle" class="role">younger son. Killed at Karbala, 680.</text>

  <rect x="860" y="820" width="240" height="78" rx="8" fill="#fff" stroke="#c4bba8" stroke-width="1.5"/>
  <text x="980" y="850" text-anchor="middle" class="name">Zaynab</text>
  <text x="980" y="872" text-anchor="middle" class="role">daughter of Fatimah and Ali</text>

  <rect x="1220" y="820" width="260" height="78" rx="8" fill="#fff" stroke="#c4bba8" stroke-width="1.5"/>
  <text x="1350" y="850" text-anchor="middle" class="name">Umm Kulthum</text>
  <text x="1350" y="872" text-anchor="middle" class="role">daughter of Fatimah and Ali</text>

  <text x="40" y="960" class="note">With Khadijah, except Ibrahim, who was the son of Mariya. Qasim, Abdullah and Ibrahim died young.</text>
  <text x="40" y="986" class="note">Abdullah the father of Muhammad is not Abdullah the son of Muhammad. Zaynab and Umm Kulthum also appear twice: once as Muhammad's daughters, once as Fatimah and Ali's daughters.</text>
  <text x="40" y="1028" class="note">What a student must be able to say: Ali is Muhammad's cousin (Abu Talib's son) and his son-in-law (Fatimah's husband). Hasan and Husayn are their sons.</text>
  <text x="40" y="1070" class="note">Shia leadership follows this bloodline: Muhammad, Fatimah, Ali, then Hasan and Husayn. Sunni leadership does not require that bloodline.</text>
  <text x="40" y="1128" class="note">Classroom guide of the standard family account. Not a full list of every wife or every child reported in every source.</text>
</svg>
