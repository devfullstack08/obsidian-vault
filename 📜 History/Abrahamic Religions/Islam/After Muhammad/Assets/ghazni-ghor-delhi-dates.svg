<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="340" viewBox="0 0 1500 340">
  <rect width="1500" height="340" fill="#faf7ef"/>
  <style>text{font-family:Arial,sans-serif;fill:#243036}.h{font-size:22px;font-weight:bold}.n{font-size:15px;font-weight:bold}.s{font-size:13px;fill:#3d474b}.w{fill:#fff}</style>
  <text x="36" y="38" class="h">Ghazni, then Ghor, then Delhi. Three different powers.</text>
  <rect x="36" y="60" width="460" height="88" rx="8" fill="#1e3a4c"/>
  <text x="266" y="94" text-anchor="middle" class="w n">Mahmud of Ghazni, 998-1030</text>
  <text x="266" y="118" text-anchor="middle" class="w s">Ghazni is a city. Campaigns into northwest India.</text>
  <text x="510" y="108" font-size="28">></text>
  <rect x="550" y="60" width="420" height="88" rx="8" fill="#245c6e"/>
  <text x="760" y="94" text-anchor="middle" class="w n">Ghurids</text>
  <text x="760" y="118" text-anchor="middle" class="w s">Ghor is a region, not Ghazni. Muhammad Ghori.</text>
  <text x="984" y="108" font-size="28">></text>
  <rect x="1024" y="60" width="440" height="88" rx="8" fill="#a85b1a"/>
  <text x="1244" y="94" text-anchor="middle" class="w n">Delhi, 1206</text>
  <text x="1244" y="118" text-anchor="middle" class="w s">Aibak. Ghori laid a base; he is not the first sultan.</text>
  <text x="36" y="186" class="n">Ghori's dates, in order</text>
  <rect x="36" y="204" width="180" height="70" rx="6" fill="#fff" stroke="#c4bba8"/>
  <text x="126" y="232" text-anchor="middle" class="n">1175</text>
  <text x="126" y="254" text-anchor="middle" class="s">Multan</text>
  <rect x="230" y="204" width="180" height="70" rx="6" fill="#f8e8e4" stroke="#8a3d12"/>
  <text x="320" y="232" text-anchor="middle" class="n">1178</text>
  <text x="320" y="254" text-anchor="middle" class="s">loses in Gujarat</text>
  <rect x="424" y="204" width="180" height="70" rx="6" fill="#fff" stroke="#c4bba8"/>
  <text x="514" y="232" text-anchor="middle" class="n">1186</text>
  <text x="514" y="254" text-anchor="middle" class="s">Lahore</text>
  <rect x="618" y="204" width="200" height="70" rx="6" fill="#f8e8e4" stroke="#8a3d12"/>
  <text x="718" y="232" text-anchor="middle" class="n">1191</text>
  <text x="718" y="254" text-anchor="middle" class="s">First Tarain: he loses</text>
  <rect x="832" y="204" width="210" height="70" rx="6" fill="#e7f0ea" stroke="#2f6f4e"/>
  <text x="937" y="232" text-anchor="middle" class="n">1192</text>
  <text x="937" y="254" text-anchor="middle" class="s">Second Tarain: he wins</text>
  <rect x="1056" y="204" width="200" height="70" rx="6" fill="#fff" stroke="#c4bba8"/>
  <text x="1156" y="232" text-anchor="middle" class="n">1194</text>
  <text x="1156" y="254" text-anchor="middle" class="s">Chandawar</text>
  <rect x="1270" y="204" width="194" height="70" rx="6" fill="#a85b1a"/>
  <text x="1367" y="232" text-anchor="middle" class="w n">1206</text>
  <text x="1367" y="254" text-anchor="middle" class="w s">Aibak at Delhi</text>
  <text x="36" y="310" class="s">Red boxes are defeats. Mahmud's son Muhammad of Ghazni is a different man from Mahmud, and from Muhammad Ghori.</text>
</svg>